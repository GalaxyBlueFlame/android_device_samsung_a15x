name: Build TWRP for A15x

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USE_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/ccache

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # full history, safer for submodules if needed

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y openjdk-11-jdk git-core gnupg flex bison gperf \
          build-essential zip curl zlib1g-dev gcc-multilib g++-multilib \
          libc6-dev-i386 lib32ncurses6-dev x11proto-core-dev libx11-dev \
          lib32z-dev ccache libgl1-mesa-dev libxml2-utils xsltproc unzip

    - name: Setup repo tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Initialize TWRP source
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/TeamWin/android_bootable_recovery.git -b twrp-12.1
        repo sync -j4

    - name: Copy device tree from fork
      run: |
        mkdir -p twrp/device/samsung/a15x
        cp -r $GITHUB_WORKSPACE/* twrp/device/samsung/a15x/

    - name: Setup build environment
      run: |
        cd twrp
        source build/envsetup.sh
        lunch twrp_a15x-eng

    - name: Build recovery image
      run: |
        cd twrp
        mka recoveryimage -j$(nproc)

    - name: Upload recovery.img artifact
      uses: actions/upload-artifact@v3
      with:
        name: recovery-img
        path: twrp/out/target/product/a15x/recovery.img
